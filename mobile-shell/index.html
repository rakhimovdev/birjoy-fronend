<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>BirJoy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(28, 120, 255, 0.16), transparent 42%),
          linear-gradient(180deg, #fff9f1 0%, #fffefb 100%);
        color: #071c55;
      }

      main {
        width: min(92vw, 420px);
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 60px rgba(7, 28, 85, 0.12);
        text-align: center;
      }

      .mark {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.9rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(32, 48, 95, 0.88);
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 188 188" aria-hidden="true">
        <defs>
          <linearGradient id="birjoy-blue" x1="40" y1="20" x2="150" y2="176" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1C78FF" />
            <stop offset="1" stop-color="#0B48D6" />
          </linearGradient>
          <linearGradient id="birjoy-orange" x1="110" y1="22" x2="178" y2="176" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF8A1F" />
            <stop offset="1" stop-color="#FF6500" />
          </linearGradient>
        </defs>
        <rect width="188" height="188" rx="42" fill="#FFF9F1" />
        <path
          fill="url(#birjoy-blue)"
          d="M57 16h20c11 0 20 9 20 20v43c13-13 30-20 49-20 21 0 41 8 56 22v33c0 33-27 60-60 60h-11c-33 0-60-27-60-60V16h-14Zm41 95c0 18 15 33 33 33s33-15 33-33-15-33-33-33-33 15-33 33Z"
        />
        <circle cx="131" cy="111" r="23" fill="#FFF9F1" />
        <path
          fill="url(#birjoy-orange)"
          d="M142 57h24v65c0 29-24 52-53 52h-26l22-27h3c16 0 30-13 30-30V57Z"
        />
        <circle cx="154" cy="34" r="13" fill="url(#birjoy-orange)" />
      </svg>
      <h1>BirJoy</h1>
      <p>Android shell assets are installed. The native app can load the live BirJoy website or fall back to local offline handling.</p>
    </main>
  </body>
</html>
