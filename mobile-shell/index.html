<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>BirJoy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(28, 120, 255, 0.16), transparent 42%),
          linear-gradient(180deg, #fff9f1 0%, #fffefb 100%);
        color: #071c55;
      }

      main {
        width: min(92vw, 420px);
        padding: 32px 28px;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 24px 60px rgba(7, 28, 85, 0.12);
        text-align: center;
      }

      img {
        width: 88px;
        height: 88px;
      }

      h1 {
        margin: 18px 0 8px;
        font-size: 1.9rem;
      }

      p {
        margin: 0;
        line-height: 1.6;
        color: rgba(32, 48, 95, 0.88);
      }
    </style>
  </head>
  <body>
    <main>
      <img src="../src/app/icon.svg" alt="BirJoy" />
      <h1>BirJoy</h1>
      <p>Android shell assets are installed. The native app loads the live BirJoy website.</p>
    </main>
  </body>
</html>
