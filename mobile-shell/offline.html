<!doctype html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>BirJoy Offline</title>
    <style>
      :root {
        color-scheme: light;
        --brand-blue: #0b48d6;
        --brand-blue-deep: #071c55;
        --brand-orange: #ff730a;
        --panel: rgba(255, 255, 255, 0.9);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at top, rgba(28, 120, 255, 0.2), transparent 36%),
          linear-gradient(180deg, #fff9f1 0%, #f8fbff 100%);
        color: var(--brand-blue-deep);
      }

      main {
        width: min(100%, 420px);
        padding: 32px 28px;
        border-radius: 32px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(7, 28, 85, 0.13);
        text-align: center;
      }

      .mark {
        width: 92px;
        height: 92px;
        margin: 0 auto 18px;
        display: block;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 2rem;
      }

      p {
        margin: 0 0 24px;
        line-height: 1.7;
        color: rgba(32, 48, 95, 0.86);
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        background: linear-gradient(135deg, var(--brand-blue) 0%, #1c78ff 100%);
        color: #fff;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        box-shadow: 0 14px 32px rgba(11, 72, 214, 0.22);
      }

      button[disabled] {
        opacity: 0.72;
        cursor: wait;
      }

      .secondary {
        margin-top: 12px;
        background: #ffffff;
        color: var(--brand-blue);
        border: 1px solid rgba(11, 72, 214, 0.14);
        box-shadow: none;
      }

      .status {
        min-height: 22px;
        margin: 0 0 16px;
        font-size: 0.95rem;
        color: rgba(32, 48, 95, 0.76);
      }

      small {
        display: block;
        margin-top: 18px;
        color: rgba(32, 48, 95, 0.7);
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 188 188" aria-hidden="true">
        <defs>
          <linearGradient id="birjoy-blue" x1="40" y1="20" x2="150" y2="176" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#1C78FF" />
            <stop offset="1" stop-color="#0B48D6" />
          </linearGradient>
          <linearGradient id="birjoy-orange" x1="110" y1="22" x2="178" y2="176" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#FF8A1F" />
            <stop offset="1" stop-color="#FF6500" />
          </linearGradient>
        </defs>
        <rect width="188" height="188" rx="42" fill="#FFF9F1" />
        <path
          fill="url(#birjoy-blue)"
          d="M57 16h20c11 0 20 9 20 20v43c13-13 30-20 49-20 21 0 41 8 56 22v33c0 33-27 60-60 60h-11c-33 0-60-27-60-60V16h-14Zm41 95c0 18 15 33 33 33s33-15 33-33-15-33-33-33-33 15-33 33Z"
        />
        <circle cx="131" cy="111" r="23" fill="#FFF9F1" />
        <path
          fill="url(#birjoy-orange)"
          d="M142 57h24v65c0 29-24 52-53 52h-26l22-27h3c16 0 30-13 30-30V57Z"
        />
        <circle cx="154" cy="34" r="13" fill="url(#birjoy-orange)" />
      </svg>
      <h1 id="status-title">BirJoy hozircha ochilmadi</h1>
      <p id="status-message">
        Internet aloqasi yoki BirJoy serveri vaqtincha mavjud emas. Aloqa tiklangach, qayta
        urinib ko‘rishingiz mumkin.
      </p>
      <p class="status" id="status-text" aria-live="polite"></p>
      <button type="button" id="retry-button">Qayta urinish</button>
      <button type="button" class="secondary" id="browser-button">Saytni brauzerda ochish</button>
      <small>BirJoy marketplace Android ilovasi</small>
    </main>
    <script>
      const LIVE_SITE_URL = "https://www.bir-joy.uz";
      const retryButton = document.getElementById("retry-button");
      const browserButton = document.getElementById("browser-button");
      const statusTitle = document.getElementById("status-title");
      const statusMessage = document.getElementById("status-message");
      const statusText = document.getElementById("status-text");
      let retryTimer = null;
      let retryInFlight = false;

      function setStatus(message) {
        statusText.textContent = message;
      }

      function updateOfflineCopy() {
        if (navigator.onLine) {
          statusTitle.textContent = "BirJoy serveriga ulanib bo‘lmadi";
          statusMessage.textContent =
            "Internet aloqasi mavjud, lekin live sayt hozircha javob bermayapti. Birozdan keyin yana urinib ko‘ring.";
          return;
        }

        statusTitle.textContent = "Internet yo‘q";
        statusMessage.textContent =
          "BirJoy’ni yuklash uchun internet aloqasi kerak. Aloqa tiklangach, qayta urinib ko‘rishingiz mumkin.";
      }

      async function retryLoad() {
        if (retryInFlight) {
          return;
        }

        retryInFlight = true;
        retryButton.disabled = true;
        setStatus("Aloqa tekshirilmoqda...");

        try {
          await fetch(LIVE_SITE_URL, {
            method: "GET",
            cache: "no-store",
            mode: "no-cors",
          });
          setStatus("BirJoy qayta yuklanmoqda...");
          window.location.assign(LIVE_SITE_URL);
          return;
        } catch (error) {
          setStatus(
            navigator.onLine
              ? "Server hali ham javob bermayapti. Keyinroq yana urinib ko‘ring."
              : "Hozircha internet topilmadi."
          );
        } finally {
          retryInFlight = false;
          retryButton.disabled = false;
        }
      }

      function scheduleRetry() {
        if (retryTimer) {
          window.clearInterval(retryTimer);
        }

        retryTimer = window.setInterval(() => {
          if (navigator.onLine) {
            void retryLoad();
          }
        }, 15000);
      }

      retryButton.addEventListener("click", () => {
        void retryLoad();
      });

      browserButton.addEventListener("click", () => {
        window.location.assign(LIVE_SITE_URL);
      });

      window.addEventListener("online", () => {
        updateOfflineCopy();
        setStatus("Aloqa tiklandi. BirJoy qayta ochilmoqda...");
        void retryLoad();
      });

      window.addEventListener("offline", () => {
        updateOfflineCopy();
        setStatus("Internet aloqasi uzildi.");
      });

      updateOfflineCopy();
      setStatus(
        navigator.onLine
          ? "Live sayt bilan aloqa tiklangach, ilova avtomatik qayta urinadi."
          : "Internet ulanganidan keyin ilova avtomatik qayta urinadi."
      );
      scheduleRetry();
    </script>
  </body>
</html>
