# Codemagic configuration for the frontend repository root.
# This repo contains the Next.js + Capacitor app and the committed iOS project.
workflows:
  ios-simulator:
    name: iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: 16.4.x
      node: 22.22.2
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        IOS_BUNDLE_IDENTIFIER: uz.birjoy.app
        XCODE_LOG_DIR: build/xcode-logs
        SPM_CLONE_DIR: build/spm
        SIMULATOR_DERIVED_DATA: build/ios-simulator/DerivedData
        SIMULATOR_RESULT_BUNDLE: build/ios-simulator/App-simulator.xcresult
        SIMULATOR_RESULT_BUNDLE_ZIP: build/ios-simulator/App-simulator.xcresult.zip
        SIMULATOR_APP_ZIP: build/ios-simulator/App-simulator.app.zip
    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/org.swift.swiftpm
        - ~/Library/Developer/Xcode/DerivedData/SourcePackages
    scripts:
      - name: Install Node.js dependencies
        script: npm ci

      - name: Build the production Next.js app
        script: npm run build

      - name: Sync the Capacitor iOS project
        script: npx cap sync ios

      - name: Resolve Swift Package Manager dependencies
        script: |
          set -o pipefail
          mkdir -p "$XCODE_LOG_DIR" "$SPM_CLONE_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_CLONE_DIR" \
            | tee "$XCODE_LOG_DIR/resolve-package-dependencies.log"

      - name: Build the unsigned simulator app
        script: |
          set -o pipefail
          mkdir -p "$XCODE_LOG_DIR"
          rm -rf "$SIMULATOR_DERIVED_DATA" "$SIMULATOR_RESULT_BUNDLE"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$SIMULATOR_DERIVED_DATA" \
            -resultBundlePath "$SIMULATOR_RESULT_BUNDLE" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build | tee "$XCODE_LOG_DIR/ios-simulator-build.log"

      - name: Package simulator artifacts
        script: |
          set -e
          APP_PATH="$SIMULATOR_DERIVED_DATA/Build/Products/Debug-iphonesimulator/App.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH="$(find "$SIMULATOR_DERIVED_DATA/Build/Products" -type d -name 'App.app' -print -quit)"
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Unable to find App.app in $SIMULATOR_DERIVED_DATA/Build/Products"
            exit 1
          fi
          mkdir -p "$(dirname "$SIMULATOR_APP_ZIP")"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$SIMULATOR_APP_ZIP"
          if [ -d "$SIMULATOR_RESULT_BUNDLE" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$SIMULATOR_RESULT_BUNDLE" \
              "$SIMULATOR_RESULT_BUNDLE_ZIP"
          fi

    artifacts:
      - build/ios-simulator/App-simulator.app.zip
      - build/ios-simulator/App-simulator.xcresult.zip
      - build/xcode-logs/*.log

  ios-release:
    name: iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      xcode: 16.4.x
      node: 22.22.2
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uz.birjoy.app
      vars:
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
        IOS_BUNDLE_IDENTIFIER: uz.birjoy.app
        XCODE_LOG_DIR: build/xcode-logs
        SPM_CLONE_DIR: build/spm
        ARCHIVE_PATH: build/ios-archive/App.xcarchive
        ARCHIVE_ZIP: build/ios-archive/App.xcarchive.zip
        ARCHIVE_RESULT_BUNDLE: build/ios-archive/App-archive.xcresult
        ARCHIVE_RESULT_BUNDLE_ZIP: build/ios-archive/App-archive.xcresult.zip
        EXPORT_PATH: build/ios-export
        EXPORT_OPTIONS_PLIST: build/ios-export/ExportOptions.plist
        DSYM_ZIP: build/ios-export/App-dSYMs.zip
    cache:
      cache_paths:
        - ~/.npm
        - ~/Library/Caches/org.swift.swiftpm
        - ~/Library/Developer/Xcode/DerivedData/SourcePackages
    scripts:
      - name: Install Node.js dependencies
        script: npm ci

      - name: Build the production Next.js app
        script: npm run build

      - name: Sync the Capacitor iOS project
        script: npx cap sync ios

      - name: Apply Codemagic iOS signing assets to the Xcode project
        script: xcode-project use-profiles

      - name: Set a unique CI build number
        script: |
          set -e
          BUILD_NUMBER_VALUE="${BUILD_NUMBER:-${CM_BUILD_ID:-1}}"
          cd ios/App
          agvtool new-version -all "$BUILD_NUMBER_VALUE"

      - name: Resolve Swift Package Manager dependencies
        script: |
          set -o pipefail
          mkdir -p "$XCODE_LOG_DIR" "$SPM_CLONE_DIR"
          xcodebuild -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -clonedSourcePackagesDirPath "$SPM_CLONE_DIR" \
            | tee "$XCODE_LOG_DIR/resolve-package-dependencies.log"

      - name: Archive the signed iOS app
        script: |
          set -o pipefail
          mkdir -p "$XCODE_LOG_DIR"
          rm -rf "$ARCHIVE_PATH" "$ARCHIVE_RESULT_BUNDLE" "$EXPORT_PATH"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE_PATH" \
            -resultBundlePath "$ARCHIVE_RESULT_BUNDLE" \
            -allowProvisioningUpdates \
            archive | tee "$XCODE_LOG_DIR/ios-release-archive.log"

      - name: Export the signed .ipa
        script: |
          set -o pipefail
          mkdir -p "$XCODE_LOG_DIR" "$EXPORT_PATH"
          cat > "$EXPORT_OPTIONS_PLIST" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key>
            <string>export</string>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS_PLIST" \
            -allowProvisioningUpdates \
            | tee "$XCODE_LOG_DIR/ios-release-export.log"

      - name: Package archive and debug symbols
        script: |
          set -e
          if [ -d "$ARCHIVE_PATH" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$ARCHIVE_PATH" "$ARCHIVE_ZIP"
          fi
          if [ -d "$ARCHIVE_RESULT_BUNDLE" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$ARCHIVE_RESULT_BUNDLE" \
              "$ARCHIVE_RESULT_BUNDLE_ZIP"
          fi
          if [ -d "$ARCHIVE_PATH/dSYMs" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "$ARCHIVE_PATH/dSYMs" \
              "$DSYM_ZIP"
          fi

      - name: Upload to TestFlight when App Store Connect API credentials are configured
        script: |
          set -euo pipefail
          if [ -z "${APP_STORE_CONNECT_KEY_IDENTIFIER:-}" ] || \
             [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ] || \
             [ -z "${APP_STORE_CONNECT_PRIVATE_KEY:-}" ]; then
            echo "App Store Connect API key variables are not configured. Skipping TestFlight upload."
            exit 0
          fi

          IPA_PATH="$(find "$EXPORT_PATH" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ] || [ ! -f "$IPA_PATH" ]; then
            echo "No exported .ipa found in $EXPORT_PATH"
            exit 1
          fi

          mkdir -p "$HOME/private_keys" "$XCODE_LOG_DIR"
          KEY_PATH="$HOME/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8"
          trap 'rm -f "$KEY_PATH"' EXIT
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"

          if [ -n "${APP_STORE_CONNECT_PROVIDER:-}" ]; then
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --asc-provider "$APP_STORE_CONNECT_PROVIDER" \
              --verbose | tee "$XCODE_LOG_DIR/testflight-upload.log"
          else
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_PATH" \
              --apiKey "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
              --verbose | tee "$XCODE_LOG_DIR/testflight-upload.log"
          fi

    artifacts:
      - build/ios-export/*.ipa
      - build/ios-export/App-dSYMs.zip
      - build/ios-archive/App.xcarchive.zip
      - build/ios-archive/App-archive.xcresult.zip
      - build/xcode-logs/*.log
